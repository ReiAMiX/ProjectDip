{% extends 'base.html' %}
{% block content %}
<h2>Товары</h2>
<div class="row">
{% for p in products %}
<div class="col-md-4">
<div class="card">
<img src="{{ p.image.url }}">
<div class="card-body">
<h5>{{ p.name }}</h5>
<p>{{ p.price }} ₽</p>
<a href="{% url 'add_to_cart' p.id %}" class="btn btn-cart">В корзину</a>
<a href="{% url 'add_to_favorites' p.id %}" class="btn btn-login">⭐</a>
</div>
</div>
</div>
{% endfor %}
</div>
{% endblock %}
